# Publish this checkout as a GitHub Pages site, straight from the repository
# root, so the editor, the map editor, the docs and the gallery are all one
# link away. No build: the src/ tree runs as-is, and .nojekyll at the root
# keeps Pages from running Jekyll over it.
#
# To turn this on once: Settings > Pages > Source: "GitHub Actions". After
# that every push to master publishes to
#   https://<owner>.github.io/PuzzleScriptNext/
# and the root index.html is the front door.
name: pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
